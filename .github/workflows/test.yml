name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  scripts:
    name: CI scripts (Rocky Linux 10)
    runs-on: ubuntu-24.04
    container: ${{ vars.KPROF_BOOTSTRAP_IMAGE || 'rockylinux/rockylinux:10' }}
    steps:
      - name: Install container prerequisites
        shell: sh
        run: |
          if [ ! -f /opt/kprof/.bootstrap-ready ]; then
            dnf install -y bash git tar python3
          fi
          # GitHub Actions container jobs may start subsequent steps with a
          # restricted PATH. Expose Rocky's system commands to the runner.
          printf '%s\n' /usr/bin /usr/sbin /bin /sbin >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - name: Install ShellCheck from EPEL
        run: |
          dnf install -y epel-release
          dnf install -y ShellCheck
      - name: Validate CI shell scripts
        run: |
          set -euo pipefail
          shellcheck .github/scripts/*.sh
          for script in .github/scripts/*.sh; do
            bash -n "$script"
          done
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Validate compiler configuration and CLI
        run: |
          uv run --project dev --no-dev kprof-dev compiler sync --check
          uv run --project dev --group dev pytest -q dev/tests

  build:
    name: ${{ matrix.compiler }} ${{ matrix.version }} (Rocky Linux 10)
    needs: scripts
    runs-on: ubuntu-24.04
    container: ${{ vars.KPROF_BOOTSTRAP_IMAGE || 'rockylinux/rockylinux:10' }}
    permissions:
      contents: read
      packages: write
    env:
      SPACK_DISABLE_LOCAL_CONFIG: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 is the bootstrap compiler. GCC 15/16 and Clang 22
          # come exclusively from the dedicated x86_64_v3 compiler buildcache.
          - compiler: GCC
            version: "15"
          - compiler: GCC
            version: "16"
          - compiler: Clang
            version: "22"
          - compiler: NVHPC
            version: "26.9"
            package: "26-9"
          - compiler: NVHPC
            version: "26.5"
            package: "26-5"
    steps:
      # These four RPMs are needed before our repository and CLI are available.
      # All compiler/Spack provisioning is then handled by the common bootstrap.
      - name: Install checkout prerequisites
        shell: sh
        run: |
          if [ ! -f /opt/kprof/.bootstrap-ready ]; then
            dnf install -y bash git tar python3
          fi
          printf '%s\n' /usr/bin /usr/sbin /bin /sbin >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Bootstrap Rocky and Spack
        run: uv run --project dev --no-dev kprof-dev compiler --backend native bootstrap
      # GitHub Actions applies GITHUB_PATH/GITHUB_ENV only after the step exits.
      - name: Verify Spack is available to subsequent steps
        run: |
          command -v spack
          spack --version
      - name: Install system compiler
        if: ${{ matrix.compiler == 'NVHPC' || (matrix.compiler == 'GCC' && matrix.version == '14') }}
        env:
          COMPILER: ${{ matrix.compiler }}
          VERSION: ${{ matrix.version }}
        run: uv run --project dev --no-dev kprof-dev compiler --backend native system-install "${COMPILER}:${VERSION}"
      - name: Restore matrix compiler from GHCR (cache only)
        if: ${{ matrix.compiler == 'Clang' || (matrix.compiler == 'GCC' && matrix.version != '14') }}
        env:
          COMPILER: ${{ matrix.compiler }}
          VERSION: ${{ matrix.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project dev --no-dev kprof-dev compiler --backend native install "${COMPILER}:${VERSION}"
      - name: Install selected compiler's development dependencies (cache first)
        env:
          COMPILER: ${{ matrix.compiler }}
          VERSION: ${{ matrix.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project dev --no-dev kprof-dev deps --backend native install --compiler "${COMPILER}:${VERSION}"
      # Different compiler/variant graphs must never share an implicit lockfile.
      # Fork PRs may build missing dependencies, but must not publish binaries.
      - name: Publish selected compiler's development dependencies
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COMPILER: ${{ matrix.compiler }}
          VERSION: ${{ matrix.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project dev --no-dev kprof-dev deps --backend native push --compiler "${COMPILER}:${VERSION}"
      - name: Configure, build and test
        run: bash .github/scripts/build-test.sh
