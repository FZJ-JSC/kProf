name: Rocky bootstrap image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dev/containers/rocky10/Dockerfile
      - dev/etc/toolchains.toml
      - dev/src/kprof_dev/toolchains.py
      - .github/workflows/bootstrap-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/containers/rocky10/Dockerfile
          push: true
          tags: ghcr.io/fzj-jsc/kprof-bootstrap-rocky10:rocky10-v1
